name: Alerta de cheias

on:
  schedule:
    - cron: "12 * * * *"   # boletim a cada 1 h
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = boletim agora · descobrir = lista estações da ANA · painel = só atualiza a página"
        type: choice
        options: [teste, descobrir, painel]
        default: teste

permissions:
  contents: write
  issues: write

concurrency:
  group: alerta
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar memória
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: memoria-${{ github.run_id }}
          restore-keys: memoria-

      - name: Instalar bibliotecas
        run: pip install --quiet matplotlib cryptography

      - name: Rodar o robô
        env:
          ANA_ID: ${{ secrets.ANA_ID }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          WHATSAPP_DESTINOS: ${{ secrets.WHATSAPP_DESTINOS }}
          MODO: ${{ inputs.modo || 'boletim' }}
        run: |
          mkdir -p cache
          if [ "$MODO" = "descobrir" ]; then python3 alerta.py; else python3 boletim.py; fi

      - name: Publicar painel (GitHub Pages)
        if: always() && hashFiles('docs/painel.png') != ''
        run: |
          cd docs
          git init -q -b gh-pages
          git config user.name "robo-cheias"
          git config user.email "robo-cheias@users.noreply.github.com"
          git add -A
          git commit -qm "painel $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Boletim por e-mail (comentário no GitHub)
        if: ${{ (inputs.modo || 'boletim') != 'painel' && (inputs.modo || 'boletim') != 'descobrir' && hashFiles('docs/boletim.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list -R "$REPO" --state open --search "Boletim do rio Itajaí in:title" --json number -q '.[0].number')
          if [ -z "$n" ]; then
            url=$(gh issue create -R "$REPO" --title "Boletim do rio Itajaí" --body "Boletins horários do robô. Cada comentário novo chega por e-mail para quem acompanha este repositório.")
            n=${url##*/}
          fi
          gh issue comment "$n" -R "$REPO" --body-file docs/boletim.md

      - name: Guardar memória
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: memoria-${{ github.run_id }}
